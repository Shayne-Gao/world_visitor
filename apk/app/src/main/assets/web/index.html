<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fog Visitor APK Shell</title>
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f172a;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .card {
      max-width: 420px;
      padding: 24px;
      border-radius: 16px;
      background: rgba(255,255,255,0.08);
      box-shadow: 0 12px 30px rgba(0,0,0,0.25);
    }
    button {
      margin-top: 12px;
      width: 100%;
      border: 0;
      border-radius: 12px;
      padding: 12px 16px;
      font-weight: 700;
    }
    pre {
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 12px;
      background: rgba(255,255,255,0.06);
      padding: 12px;
      border-radius: 12px;
      margin-top: 12px;
    }
    .track-list {
      margin-top: 12px;
      background: rgba(255,255,255,0.06);
      border-radius: 12px;
      padding: 12px;
      font-size: 12px;
    }
    .track-item {
      padding: 8px 0;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .track-item:last-child {
      border-bottom: 0;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>Fog Visitor APK 原型</h2>
    <p>当前已接入原生前台服务骨架、定位回调入口和本地轨迹存储雏形。下一步会把这套数据与正式 Web UI 接起来。</p>
    <button onclick="AndroidBridge.startBackgroundTracking()">启动原生后台记录</button>
    <button onclick="AndroidBridge.stopBackgroundTracking()">停止原生后台记录</button>
    <button onclick="showStatus()">读取原生记录状态</button>
    <button onclick="showArchive()">读取原生轨迹存档 JSON</button>
    <button onclick="showSummary()">读取原生存档摘要</button>
    <button onclick="showRecovery()">读取恢复状态</button>
    <button onclick="exportArchive()">导出原生存档到下载目录</button>
    <button onclick="replaceWithSample()">用示例 JSON 覆盖导入</button>
    <button onclick="mergeWithSample()">用示例 JSON 合并导入</button>
    <button onclick="recoverDraft()">将未完成草稿恢复成轨迹</button>
    <button onclick="renderTracks()">渲染原生轨迹列表</button>
    <pre id="output">等待原生状态...</pre>
    <div class="track-list" id="trackList">轨迹列表尚未加载</div>
  </div>
  <script>
    const sampleArchive = JSON.stringify({
      version: "2.0.0",
      metadata: { totalAreaKm2: 0, createdAt: Date.now() },
      sourceOfTruth: {
        tracks: [
          {
            id: "sample_track_1",
            timestamp: Date.now(),
            source: "android_sample_import",
            brushRadiusKm: 0.02,
            encodedPath: "_p~iF~ps|U_ulLnnqC_mqNvxq`@",
            bbox: [-120.2, 38.5, -126.453, 43.252]
          }
        ]
      }
    }, null, 2);

    function showStatus() {
      document.getElementById('output').textContent = AndroidBridge.getNativeTrackingStatus();
    }
    function showArchive() {
      document.getElementById('output').textContent = AndroidBridge.exportNativeArchiveJson();
    }
    function showSummary() {
      document.getElementById('output').textContent = AndroidBridge.getNativeArchiveSummary();
    }
    function showRecovery() {
      document.getElementById('output').textContent = AndroidBridge.getNativeRecoveryStatus();
    }
    function exportArchive() {
      document.getElementById('output').textContent = AndroidBridge.exportNativeArchiveToDownloads();
    }
    function replaceWithSample() {
      document.getElementById('output').textContent = AndroidBridge.importNativeArchiveJson(sampleArchive, false);
    }
    function mergeWithSample() {
      document.getElementById('output').textContent = AndroidBridge.importNativeArchiveJson(sampleArchive, true);
    }
    function recoverDraft() {
      document.getElementById('output').textContent = AndroidBridge.recoverDraftAsTrack();
    }
    function renderTracks() {
      const raw = AndroidBridge.getNativeArchiveTracks();
      const tracks = JSON.parse(raw);
      const el = document.getElementById('trackList');
      if (!tracks.length) {
        el.textContent = '当前没有原生轨迹';
        return;
      }
      el.innerHTML = tracks.map(track => {
        const d = new Date(track.timestamp);
        return `
          <div class="track-item">
            <div><strong>${track.id}</strong></div>
            <div>来源: ${track.source}</div>
            <div>时间: ${d.toLocaleString()}</div>
            <div>画笔: ${track.brushRadiusKm} km</div>
            <div>bbox: ${track.bbox ? track.bbox.join(', ') : 'none'}</div>
          </div>
        `;
      }).join('');
    }
    showStatus();
    renderTracks();
  </script>
</body>
</html>
