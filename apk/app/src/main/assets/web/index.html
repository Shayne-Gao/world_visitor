<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fog Visitor APK Shell</title>
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f172a;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .card {
      max-width: 420px;
      padding: 24px;
      border-radius: 16px;
      background: rgba(255,255,255,0.08);
      box-shadow: 0 12px 30px rgba(0,0,0,0.25);
    }
    button {
      margin-top: 12px;
      width: 100%;
      border: 0;
      border-radius: 12px;
      padding: 12px 16px;
      font-weight: 700;
    }
    pre {
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 12px;
      background: rgba(255,255,255,0.06);
      padding: 12px;
      border-radius: 12px;
      margin-top: 12px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>Fog Visitor APK 原型</h2>
    <p>当前已接入原生前台服务骨架、定位回调入口和本地轨迹存储雏形。下一步会把这套数据与正式 Web UI 接起来。</p>
    <button onclick="AndroidBridge.startBackgroundTracking()">启动原生后台记录</button>
    <button onclick="AndroidBridge.stopBackgroundTracking()">停止原生后台记录</button>
    <button onclick="showStatus()">读取原生记录状态</button>
    <button onclick="showArchive()">读取原生轨迹存档 JSON</button>
    <pre id="output">等待原生状态...</pre>
  </div>
  <script>
    function showStatus() {
      document.getElementById('output').textContent = AndroidBridge.getNativeTrackingStatus();
    }
    function showArchive() {
      document.getElementById('output').textContent = AndroidBridge.exportNativeArchiveJson();
    }
    showStatus();
  </script>
</body>
</html>
