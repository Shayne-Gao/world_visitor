<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fog Visitor APK Shell</title>
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f172a;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .card {
      max-width: 420px;
      padding: 24px;
      border-radius: 16px;
      background: rgba(255,255,255,0.08);
      box-shadow: 0 12px 30px rgba(0,0,0,0.25);
    }
    button {
      margin-top: 12px;
      width: 100%;
      border: 0;
      border-radius: 12px;
      padding: 12px 16px;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>Fog Visitor APK 原型</h2>
    <p>当前为 Android 独立工程骨架。下一步会把 Web 版本页面和原生后台定位服务真正接起来。</p>
    <button onclick="AndroidBridge.startBackgroundTracking()">启动原生后台记录</button>
    <button onclick="AndroidBridge.stopBackgroundTracking()">停止原生后台记录</button>
  </div>
</body>
</html>
